presets:
  default:
    name: "IDE like layout"
    description: "Neovim main pane with three terminal splits below and an AI pane on the right"
    layout:
      type: horizontal
      ratio: [70, 30]
      panes:
        - type: vertical
          ratio: [70, 30]
          panes:
            - name: "neovim"
              command: "nvim"
              focus: true
            - type: horizontal
              ratio: [1, 1, 1]
              panes:
                - name: "term1"
                - name: "term2"
                - name: "term3"
        - name: "coding agent"
          command: "codex --yolo --no-daemon"

  ai-workbench:
    name: "AI Assisted Workbench"
    description: "Three columns across; left and center columns split into upper and lower panes, rightmost reserved for the AI client"
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [2, 2, 3]
      panes:
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: "work-left-top"
            - name: "work-left-bottom"
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: "work-center-top"
            - name: "work-center-bottom"
        - type: vertical
          ratio: [1, "12c"]
          panes:
            - name: "codex"
              command: "codex --yolo --no-daemon"
            - name: "editprompt"
              command: "editprompt open --target-pane {{pane_id:codex}}"
              focus: true
              ephemeral: true

  codex-and-claude:
    name: codex-and-claude
    description: "Input to Codex and Claude in parallel"
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [25, 37.5, 37.5]
      panes:
        - name: zsh
        - type: vertical
          ratio: [1, "12c"]
          panes:
            - name: codex
              command: "codex --yolo --no-daemon"
            - name: editprompt-codex
              command: "editprompt open --target-pane {{pane_id:codex}}"
              ephemeral: true
        - type: vertical
          ratio: [1, "12c"]
          panes:
            - name: claude
              command: "claude --dangerously-skip-permissions"
            - name: editprompt-claude
              command: "editprompt open --target-pane {{pane_id:claude}}"
              ephemeral: true

  cc-grid:
    name: cc-grid
    description: "Three columns, each with Codex above Claude"
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1, 1]
      panes:
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: codex-1
              command: "codex --yolo --no-daemon"
              focus: true
            - name: claude-1
              command: "claude --dangerously-skip-permissions"
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: codex-2
              command: "codex --yolo --no-daemon"
            - name: claude-2
              command: "claude --dangerously-skip-permissions"
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: codex-3
              command: "codex --yolo --no-daemon"
            - name: claude-3
              command: "claude --dangerously-skip-permissions"

  3x2:
    name: "3x2"
    description: "Three equal columns, each split into two shell panes"
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1, 1]
      panes:
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: term1
              focus: true
            - name: term2
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: term3
            - name: term4
        - type: vertical
          ratio: [1, 1]
          panes:
            - name: term5
            - name: term6
