# @nvim.on_save bun run codex:template --apply
model = "gpt-6.1-sol"
# model_context_window = 400000
# model_auto_compact_token_limit = 360000
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
web_search = "live"

notify = [
  "~/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended",
  "--previous-notify",
  "[\"vde-notifier\",\"--codex\",\"--skip-codex-subagent\",\"--skip-codex-non-interactive\"]"
]
suppress_unstable_features_warning = true

[shell_environment_policy.set]
OP_ACCOUNT = "dionore.1password.com"

[sandbox_workspace_write]
network_access = true

[agents]
max_concurrent_threads_per_session = 6
max_depth = 1

[agents.explorer]
description = "Static codebase explorer. Use to locate files, trace code paths, and map architecture before decisions. No edits, runtime diagnosis, review verdicts, or acceptance testing."
config_file = "~/.codex/agents/explorer.toml"

[agents.worker]
description = "Implementation agent. Use after the scope is understood to edit code, refactor, and run change-local tests. It must not independently approve its own work."
config_file = "~/.codex/agents/worker.toml"

[agents.reviewer]
description = "Independent static reviewer. Use after implementation or before merge to find correctness, security, regression, and maintainability issues. No edits or acceptance execution."
config_file = "~/.codex/agents/reviewer.toml"

[agents.verifier]
description = "Independent acceptance verifier. Use to run existing checks and evaluate DoD or behavior claims with evidence. No implementation or fixes."
config_file = "~/.codex/agents/verifier.toml"

[agents.spec_critic]
description = "Pre-implementation specification critic. Use to audit plans and designs for contradictions, missing states, failure handling, and measurable DoD. No edits or implementation."
config_file = "~/.codex/agents/spec_critic.toml"

[agents.diagnostician]
description = "Runtime diagnosis agent. Use for observed bugs involving logs, processes, browsers, tmux, OS state, or reproduction. No source edits or final review verdicts."
config_file = "~/.codex/agents/diagnostician.toml"

[features]
default_mode_request_user_input = true
memories = true
chronicle = true
reasoning_effort_override = true

# context_management = { experimental_mode = true }
# token_budget.enabled = true
# token_budget.use_history_notes_extension = true

[memories]
generate_memories = true
use_memories = true
extract_model = "gpt-6-luna"
consolidation_model = "gpt-6.1-sol"

[tui]
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "context-window-size", "fast-mode", "weekly-limit", "five-hour-limit"]
theme = "catppuccin-mocha"
terminal_title = []
fullscreen_transcript = false
screen_reader_detection_done = true

# [mcp_servers.chrome-devtools]
# command = "npx"
# args = [
#   "-y",
#   "chrome-devtools-mcp@latest",
#   "--autoConnect",
#   "--categoryExperimentalWebmcp",
#   "--no-usage-statistics"
# ]
# startup_timeout_sec = 20
# tool_timeout_sec = 120
# enabled = true

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "~/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "~/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "{{CHATGPT_APP_VERSION}}"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"~/.codex/plugins/cache/openai-bundled/browser/{{CHATGPT_APP_VERSION}}/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "~/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[plugins."github@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."drawio@drawio"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-history@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "~/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "~/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.drawio]
source_type = "git"
source = "https://github.com/jgraph/drawio-mcp.git"
